name: Build ReArchiver APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          ls -la
          unzip -l ReArchiver-Cloud-Build.zip | head -40
