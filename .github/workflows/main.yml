
name: Build ReArchiver APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto do ZIP
        run: |
          unzip -o ReArchiver-Cloud-Build.zip -d source
          test -f source/ReArchiver/app/build.gradle.kts
          test -f source/ReArchiver/settings.gradle.kts

      - name: Compilar APK
        working-directory: source/ReArchiver
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ReArchiver-debug-apk
          path: source/ReArchiver/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
